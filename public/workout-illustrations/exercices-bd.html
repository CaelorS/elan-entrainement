<!doctype html><html lang="fr"><base href="../exercise-illustrations-bd/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Élan · Illustrations des exercices</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#101813;color:#eff2e9}*{box-sizing:border-box}body{margin:0;padding:32px clamp(16px,4vw,64px) 64px}header{max-width:1440px;margin:auto auto 26px}a{color:#c5f567}h1{font-size:clamp(28px,4vw,46px);margin:22px 0 8px;letter-spacing:-.04em}p{color:#b9c6b1;line-height:1.6}header p{max-width:780px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:24px 0}input,select,button{font:inherit;border:1px solid #495544;border-radius:12px;background:#243021;color:inherit;padding:13px 16px;min-height:48px}input{flex:1;min-width:190px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #c5f567;outline-offset:4px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:1440px;margin:auto}article{border:1px solid #394634;border-radius:18px;overflow:hidden;background:#1c271d}.picture{display:block;border:0;border-radius:0;padding:0;background:#f9f1e8;width:100%;aspect-ratio:2;overflow:hidden;cursor:zoom-in}.picture img{display:block;width:100%;height:100%;object-fit:contain}.picture.single{aspect-ratio:1}.picture.single img{width:200%;max-width:none;object-fit:fill}.picture.female img{transform:translateX(-50%)}.caption{padding:18px}.caption h2{font-size:18px;margin:0 0 10px;line-height:1.35}.caption p{margin:4px 0 12px;font-size:13px}.caption a{font-size:14px}.pager{display:flex;align-items:center;justify-content:center;gap:18px;margin:32px auto 0}dialog{max-width:min(95vw,1400px);max-height:95dvh;border:1px solid #53624a;border-radius:22px;padding:18px;background:#19231b}dialog::backdrop{background:#000b;backdrop-filter:blur(8px)}dialog img{display:block;width:100%;max-height:76dvh;object-fit:contain;border-radius:12px}dialog h2{font-size:20px;margin:0 0 14px}dialog form{display:flex;justify-content:flex-end;margin-top:12px}#status{min-height:1.5em}small{color:#b9c6b1}@media(max-width:1000px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){body{padding-top:20px}main{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:1fr}input,select{width:100%}}
</style>
<header><a href="../">← Élan</a><h1>Les mouvements d’Élan</h1><p>BD sportive réaliste · Une version masculine et une version féminine de chaque mouvement, avec les muscles sollicités mis en évidence.</p><div class="controls"><input id="search" type="search" aria-label="Rechercher un exercice" placeholder="Rechercher un exercice…"><select id="view" aria-label="Version des illustrations"><option value="pair">Homme + femme</option><option value="mixed">Mixte</option><option value="male">Homme</option><option value="female">Femme</option></select></div><p id="status" role="status">Chargement des illustrations…</p></header><main id="gallery"></main><nav class="pager" aria-label="Pages des illustrations"><button id="prev">← Précédent</button><span id="page"></span><button id="next">Suivant →</button></nav><dialog id="zoom"><h2></h2><img alt=""><form method="dialog"><button>Fermer</button></form></dialog>
<script type="module">
const $=id=>document.getElementById(id),normal=s=>s.normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();
let entries=[],page=Math.max(0,Number(new URLSearchParams(location.search).get('page')||1)-1);const perPage=12;
function render(){const result=entries.filter(e=>normal(e.name+' '+e.equipment).includes(normal($('search').value)));const pages=Math.max(1,Math.ceil(result.length/perPage));page=Math.min(page,pages-1);$('gallery').replaceChildren();$('status').textContent=result.length+' mouvements · '+entries.length+' planches disponibles';$('page').textContent=(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page===pages-1;
 for(const e of result.slice(page*perPage,(page+1)*perPage)){const article=document.createElement('article'),button=document.createElement('button'),img=document.createElement('img'),caption=document.createElement('div'),title=document.createElement('h2'),link=document.createElement('a');const pref=$('view').value,side=pref==='mixed'?(entries.indexOf(e)%2?'female':'male'):pref;button.className='picture'+(side==='pair'?'':' single '+side);button.type='button';button.setAttribute('aria-label','Agrandir '+e.name);img.src=e.file;img.alt=e.name;img.loading='lazy';img.decoding='async';button.append(img);button.onclick=()=>{$('zoom').querySelector('img').src=e.file;$('zoom').querySelector('img').alt=e.name;$('zoom').querySelector('h2').textContent=e.name;$('zoom').showModal()};caption.className='caption';title.textContent=e.name;link.href=e.file;link.download=e.file;link.textContent='Télécharger la planche PNG';caption.append(title);if(e.interpretation){const note=document.createElement('p');note.textContent='Illustration indicative · variante à préciser.';caption.append(note)}caption.append(link);article.append(button,caption);$('gallery').append(article)}
}
$('search').oninput=()=>{page=0;render()};$('view').onchange=render;$('prev').onclick=()=>{page--;render();scrollTo({top:0,behavior:'instant'})};$('next').onclick=()=>{page++;render();scrollTo({top:0,behavior:'instant'})};
try{const response=await fetch('./catalogue.json');if(!response.ok)throw Error();entries=await response.json();render()}catch{$('status').textContent='Le catalogue est indisponible. Réessaie dans quelques instants.'}
</script></html>
